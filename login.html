<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Emmy Pics to Video AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 20px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: #a855f7; }
nav a { color: #d8b4fe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); margin-left: 8px; }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 50px 20px; }
.hero h1 { font-size: 34px; margin-bottom: 12px; }
.hero h1 span { color: #a855f7; }
.hero > p { color: #aaa; margin-bottom: 30px; }
.card { background: #101017; border: 1px solid #292936; border-radius: 18px; padding: 25px; width: 100%; max-width: 450px; text-align: left; }
input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #383848; background: #0b0b12; color: white; font-size: 15px; font-family: inherit; margin-bottom: 15px; }
input:focus { outline: none; border-color: #8b5cf6; }
.password-wrap { position: relative; width: 100%; margin-bottom: 10px; }
.password-wrap input { padding-right: 55px; margin-bottom: 0; }
.toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: 20px; }
.forgot-row { text-align: right; margin-bottom: 20px; }
.forgot-row a { color: #8b5cf6; text-decoration: none; font-size: 14px; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
.primary { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.primary:disabled { opacity: 0.6; cursor: not-allowed; }
.secondary { background: #191923; border: 1px solid #353545; color: white; margin-top: 15px; display: none; }
.message { margin-top: 20px; color: #aaa; line-height: 1.5; font-size: 14px; }
</style>
</head>
<body>

<header>
    <div class="logo">Emmy <span>AI</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Sign Up</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome <span>Back</span></h1>
    <p>Login to your Emmy Pics to Video AI account.</p>

    <div class="card">
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
            <div class="password-wrap">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="button" id="togglePassword" class="toggle-btn" aria-label="Show password">👁</button>
            </div>
            <div class="forgot-row"><a href="forgot-password.html">Forgot password?</a></div>
            <button type="submit" id="loginButton" class="btn primary">Login</button>
        </form>
        <button type="button" id="resendButton" class="btn secondary">📧 Resend Verification Email</button>
        <p id="message" class="message"></p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const loginButton = document.getElementById("loginButton");
const resendButton = document.getElementById("resendButton");
const message = document.getElementById("message");

togglePassword.addEventListener("click", function () {
    if (passwordInput.type === "password") { passwordInput.type = "text"; togglePassword.textContent = "🙈"; }
    else { passwordInput.type = "password"; togglePassword.textContent = "👁"; }
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    loginButton.disabled = true;
    resendButton.style.display = "none";
    loginButton.textContent = "Logging in...";
    message.style.color = "#aaa";
    message.textContent = "Please wait...";
    try {
        const existing = await getCurrentUser();
        if (existing) { try { await account.deleteSession({ sessionId: "current" }); } catch (e) {} }
        await account.createEmailPasswordSession({ email: email, password: password });
        const user = await account.get();
        if (!user.emailVerification) {
            message.style.color = "#ffb366";
            message.textContent = "Your email has not been verified yet. Tap below to receive another verification email.";
            resendButton.style.display = "block";
            loginButton.disabled = false;
            loginButton.textContent = "Login";
            return;
        }
        message.style.color = "#9cffb0";
        message.textContent = "Login successful!";
        setTimeout(function () { window.location.href = "dashboard.html"; }, 500);
    } catch (error) {
        console.error(error);
        message.style.color = "#ff7777";
        message.textContent = error.message || "Login failed. Please check your email and password.";
        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }
});

resendButton.addEventListener("click", async function () {
    resendButton.disabled = true;
    resendButton.textContent = "Sending...";
    message.style.color = "#aaa";
    message.textContent = "Sending a new verification email...";
    try {
        await account.get();
        await account.createVerification({ url: siteUrl("verify.html") });
        message.style.color = "#9cffb0";
        message.textContent = "Verification email sent! Check your inbox and spam folder.";
        resendButton.textContent = "Verification Email Sent";
    } catch (error) {
        console.error(error);
        message.style.color = "#ff7777";
        message.textContent = error.message || "Unable to send verification email.";
        resendButton.disabled = false;
        resendButton.textContent = "📧 Resend Verification Email";
    }
});
</script>

</body>
</html>
