<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Emmy Pics to Video AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 20px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: #a855f7; }
nav a { color: #d8b4fe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); margin-left: 8px; }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 50px 20px; }
.hero h1 { font-size: 32px; margin-bottom: 12px; }
.hero h1 span { color: #a855f7; }
.hero > p { color: #aaa; max-width: 500px; line-height: 1.6; margin-bottom: 30px; }
.card { background: #101017; border: 1px solid #292936; border-radius: 18px; padding: 25px; width: 100%; max-width: 450px; text-align: left; }
input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #383848; background: #0b0b12; color: white; font-size: 15px; font-family: inherit; margin-bottom: 20px; }
input:focus { outline: none; border-color: #8b5cf6; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
.primary { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.primary:disabled { opacity: 0.6; cursor: not-allowed; }
.message { margin-top: 20px; color: #aaa; line-height: 1.5; font-size: 14px; }
.back-row { margin-top: 25px; text-align: center; }
.back-row a { color: #8b5cf6; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<header>
    <div class="logo">Emmy <span>AI</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Reset Your <span>Password</span></h1>
    <p>Enter the email address connected to your Emmy AI account. We'll send you a secure password reset link.</p>

    <div class="card">
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
            <button type="submit" id="resetButton" class="btn primary">Send Reset Link</button>
        </form>

        <p id="message" class="message"></p>

        <div class="back-row">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const resetButton = document.getElementById("resetButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const email = emailInput.value.trim();
    if (!email) {
        message.style.color = "#ff7777";
        message.textContent = "Please enter your email address.";
        return;
    }
    resetButton.disabled = true;
    resetButton.textContent = "Sending...";
    message.style.color = "#aaa";
    message.textContent = "Please wait...";
    try {
        await account.createRecovery({
            email: email,
            url: siteUrl("reset-password.html")
        });
        message.style.color = "#9cffb0";
        message.textContent = "Reset link sent! Check your email (including spam) and tap the link to create a new password.";
        resetButton.textContent = "Reset Link Sent";
    } catch (error) {
        console.error(error);
        message.style.color = "#ff7777";
        message.textContent = error.message || "Unable to send the reset link. Please check your email and try again.";
        resetButton.disabled = false;
        resetButton.textContent = "Send Reset Link";
    }
});
</script>

</body>
</html>
