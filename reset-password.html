<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Emmy Pics to Video AI</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 16px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span { color: #a855f7; }
nav { display: flex; align-items: center; gap: 6px; }
nav a { color: #d8b4fe; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 50px 20px; }
.hero h1 { font-size: 32px; margin-bottom: 12px; }
.hero h1 span { color: #a855f7; }
.hero > p { color: #aaa; max-width: 500px; line-height: 1.6; margin-bottom: 30px; }
.card { background: #101017; border: 1px solid #292936; border-radius: 18px; padding: 25px; width: 100%; max-width: 450px; text-align: left; }
input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #383848; background: #0b0b12; color: white; font-size: 15px; font-family: inherit; }
input:focus { outline: none; border-color: #8b5cf6; }
.password-wrap { position: relative; width: 100%; margin-bottom: 15px; }
.password-wrap input { padding-right: 55px; }
.toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; font-size: 20px; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; }
.primary { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.primary:disabled { opacity: 0.6; cursor: not-allowed; }
.message { margin-top: 20px; color: #aaa; line-height: 1.5; font-size: 14px; text-align: center; }
#loginLink { display: none; margin-top: 25px; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="logo.jpg" alt="Emmy AI" class="logo-img">
        <span class="logo-text">Emmy <span>AI</span></span>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <h1>Create a New <span>Password</span></h1>
    <p>Enter your new password below to secure your Emmy AI account.</p>

    <div class="card">
        <form id="resetForm">
            <div class="password-wrap">
                <input type="password" id="password" placeholder="New password (min 8 characters)" autocomplete="new-password" minlength="8" required>
                <button type="button" id="togglePassword" class="toggle-btn" aria-label="Show password">👁</button>
            </div>
            <div class="password-wrap">
                <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>
                <button type="button" id="toggleConfirmPassword" class="toggle-btn" aria-label="Show password">👁</button>
            </div>
            <button type="submit" id="resetButton" class="btn primary">Reset Password</button>
        </form>
        <p id="message" class="message"></p>
        <div id="loginLink">
            <a href="login.html" class="btn primary">Continue to Login</a>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
const form = document.getElementById("resetForm");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const togglePassword = document.getElementById("togglePassword");
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
const resetButton = document.getElementById("resetButton");
const message = document.getElementById("message");
const loginLink = document.getElementById("loginLink");

const params = new URLSearchParams(window.location.search);
const userId = params.get("userId");
const secret = params.get("secret");

if (!userId || !secret) {
    message.style.color = "#ff7777";
    message.textContent = "This password reset link is invalid or incomplete.";
    resetButton.disabled = true;
}

togglePassword.addEventListener("click", function () {
    if (passwordInput.type === "password") { passwordInput.type = "text"; togglePassword.textContent = "🙈"; }
    else { passwordInput.type = "password"; togglePassword.textContent = "👁"; }
});

toggleConfirmPassword.addEventListener("click", function () {
    if (confirmPasswordInput.type === "password") { confirmPasswordInput.type = "text"; toggleConfirmPassword.textContent = "🙈"; }
    else { confirmPasswordInput.type = "password"; toggleConfirmPassword.textContent = "👁"; }
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    if (password.length < 8) {
        message.style.color = "#ff7777";
        message.textContent = "Password must be at least 8 characters.";
        return;
    }
    if (password !== confirmPassword) {
        message.style.color = "#ff7777";
        message.textContent = "The passwords do not match.";
        return;
    }
    resetButton.disabled = true;
    resetButton.textContent = "Resetting...";
    message.style.color = "#aaa";
    message.textContent = "Please wait...";
    try {
        await account.updateRecovery({ userId: userId, secret: secret, password: password });
        message.style.color = "#9cffb0";
        message.textContent = "🎉 Your password has been successfully changed!";
        resetButton.style.display = "none";
        loginLink.style.display = "block";
    } catch (error) {
        console.error(error);
        message.style.color = "#ff7777";
        message.textContent = error.message || "Password reset failed. The link may have expired.";
        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
    }
});
</script>

</body>
</html>
