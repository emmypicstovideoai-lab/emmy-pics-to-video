<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Result - Emmy Pics to Video AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 20px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: #a855f7; }
header a { color: #d8b4fe; text-decoration: none; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); }
.container { max-width: 700px; margin: 40px auto; padding: 20px; }
h1 { text-align: center; font-size: 32px; margin-bottom: 10px; }
.subtitle { text-align: center; color: #999; margin-bottom: 30px; }
.card { background: #101017; border: 1px solid #292936; border-radius: 18px; padding: 25px; margin-bottom: 20px; }
.status { text-align: center; padding: 20px; border-radius: 12px; background: #171322; border: 1px solid #57328a; color: #c9a7ff; margin-bottom: 25px; line-height: 1.6; }
.status-icon { font-size: 42px; margin-bottom: 10px; }
.status strong { display: block; font-size: 18px; margin-bottom: 6px; }
.label { color: #999; font-size: 13px; margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
.prompt-box { background: #0b0b12; border: 1px solid #292936; border-radius: 10px; padding: 15px; line-height: 1.6; margin-bottom: 20px; word-break: break-word; }
.video-box { display: none; width: 100%; border-radius: 14px; background: #050507; margin-bottom: 20px; }
.loading { text-align: center; color: #999; padding: 30px; line-height: 1.6; }
.error { text-align: center; color: #ff8a8a; padding: 20px; line-height: 1.6; }
.buttons { display: flex; flex-direction: column; gap: 12px; }
.btn { display: block; width: 100%; padding: 15px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: bold; border: none; font-size: 15px; cursor: pointer; }
.primary { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.secondary { background: #191923; border: 1px solid #353545; color: white; }
</style>
</head>
<body>

<header>
    <div class="logo">Emmy <span>AI</span></div>
    <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">
    <h1>Video Result</h1>
    <p class="subtitle">Your Emmy AI video request</p>

    <div class="card">
        <div id="loading" class="loading">Loading your video request...</div>

        <div id="content" style="display:none;">
            <div class="status">
                <div class="status-icon" id="statusIcon">🎬</div>
                <strong id="statusTitle">Video Processing</strong>
                <span id="statusText">Your video request has been received.</span>
            </div>

            <div class="label">Your Prompt</div>
            <div id="prompt" class="prompt-box"></div>

            <video id="video" class="video-box" controls></video>

            <div class="buttons">
                <a href="create-video.html" class="btn primary">🎬 Create Another Video</a>
                <a href="my-videos.html" class="btn secondary">📁 My Videos</a>
                <a href="dashboard.html" class="btn secondary">← Back to Dashboard</a>
            </div>
        </div>

        <div id="error" class="error" style="display:none;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
const loading = document.getElementById("loading");
const content = document.getElementById("content");
const errorBox = document.getElementById("error");
const promptBox = document.getElementById("prompt");
const statusTitle = document.getElementById("statusTitle");
const statusText = document.getElementById("statusText");
const statusIcon = document.getElementById("statusIcon");
const video = document.getElementById("video");

async function loadVideoRequest() {
    try {
        const user = await getCurrentUser();
        if (!user) { window.location.href = "login.html"; return; }

        const params = new URLSearchParams(window.location.search);
        const videoId = params.get("id");
        if (!videoId) { throw new Error("No video request ID was provided."); }

        const row = await tablesDB.getRow({
            databaseId: DATABASE_ID,
            tableId: VIDEOS_TABLE_ID,
            rowId: videoId
        });

        if (row.userId !== user.$id) {
            throw new Error("You do not have permission to view this video request.");
        }

        promptBox.textContent = row.prompt || "No prompt";
        const status = row.status || "pending";

        if (status === "completed") {
            statusIcon.textContent = "🎉";
            statusTitle.textContent = "Video Ready";
            statusText.textContent = "Your AI video is ready.";
            if (row.videoUrl) { video.src = row.videoUrl; video.style.display = "block"; }
        } else if (status === "failed") {
            statusIcon.textContent = "❌";
            statusTitle.textContent = "Video Generation Failed";
            statusText.textContent = "Something went wrong while creating your video.";
        } else {
            statusIcon.textContent = "⏳";
            statusTitle.textContent = "Video Pending";
            statusText.textContent = "Your video request has been received and saved. The AI video generator will be connected later.";
        }

        loading.style.display = "none";
        content.style.display = "block";
    } catch (error) {
        console.error("VIDEO RESULT ERROR:", error);
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = error.message || "Unable to load your video request.";
    }
}

loadVideoRequest();
</script>

</body>
</html>
