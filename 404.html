<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - Emmy Pics to Video AI</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 16px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span { color: #a855f7; }
nav { display: flex; align-items: center; gap: 6px; }
nav a { color: #d8b4fe; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 80px 20px; min-height: 70vh; }
.code { font-size: 110px; font-weight: 900; letter-spacing: -4px; background: linear-gradient(135deg, #8b5cf6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 20px; }
.hero h1 { font-size: 32px; margin-bottom: 15px; }
.hero h1 span { color: #a855f7; }
.hero p { color: #aaa; max-width: 500px; line-height: 1.6; margin-bottom: 35px; font-size: 16px; }
.buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 15px 28px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; font-size: 15px; }
.primary { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.secondary { border: 1px solid #383848; color: white; background: transparent; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="logo.jpg" alt="Emmy AI" class="logo-img">
        <span class="logo-text">Emmy <span>AI</span></span>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <div class="code">404</div>
    <h1>Page <span>Not Found</span></h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

    <div class="buttons">
        <a href="index.html" class="btn primary">Go to Homepage</a>
        <a href="dashboard.html" class="btn secondary">My Dashboard</a>
    </div>
</section>

</body>
</html>
