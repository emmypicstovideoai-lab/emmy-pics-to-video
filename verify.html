<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Emmy Pics to Video AI</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 16px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span { color: #a855f7; }
nav { display: flex; align-items: center; gap: 6px; }
nav a { color: #d8b4fe; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); }
.hero { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 60px 20px; min-height: 70vh; }
.hero h1 { font-size: 32px; margin-bottom: 20px; }
.hero h1 span { color: #a855f7; }
.icon { font-size: 60px; margin-bottom: 20px; }
#message { color: #aaa; max-width: 500px; line-height: 1.6; margin-bottom: 30px; font-size: 16px; }
.btn { padding: 15px 28px; border-radius: 10px; text-decoration: none; font-weight: bold; display: inline-block; background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; border: none; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="logo.jpg" alt="Emmy AI" class="logo-img">
        <span class="logo-text">Emmy <span>AI</span></span>
    </a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="hero">
    <div class="icon">📧</div>
    <h1>Verify Your <span>Email</span></h1>
    <p id="message">Verifying your email address, please wait...</p>
    <a href="login.html" class="btn" id="loginButton" style="display:none;">Continue to Login</a>
</section>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
async function verifyEmail() {
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const icon = document.querySelector(".icon");
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("userId");
    const secret = params.get("secret");
    if (!userId || !secret) {
        icon.textContent = "⚠️";
        message.style.color = "#ffb366";
        message.textContent = "This verification link is missing information or is invalid. Please check that you clicked the full link from your email.";
        loginButton.style.display = "inline-block";
        return;
    }
    try {
        await account.updateVerification({ userId: userId, secret: secret });
        icon.textContent = "🎉";
        message.style.color = "#9cffb0";
        message.textContent = "Your email has been successfully verified! You can now log in and start creating videos.";
        loginButton.style.display = "inline-block";
    } catch (error) {
        console.error(error);
        icon.textContent = "❌";
        message.style.color = "#ff7777";
        message.textContent = error.message || "Verification failed. The link may have expired or already been used.";
        loginButton.style.display = "inline-block";
    }
}
verifyEmail();
</script>

</body>
</html>
