<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Emmy Pics to Video AI</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(139,92,246,0.18), transparent 35%), radial-gradient(circle at bottom left, rgba(168,85,247,0.10), transparent 35%), #08080d; color: white; min-height: 100vh; }
header { padding: 14px 6%; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(8,8,13,0.88); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; gap: 10px; }
.logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
.logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo-text span { color: #a855f7; }
.admin-badge { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; letter-spacing: 1px; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.header-actions a, .header-actions button { color: #d8b4fe; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 10px; border: 1px solid rgba(168,85,247,0.35); background: rgba(139,92,246,0.10); cursor: pointer; }
.header-actions .logout-btn { color: white; border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); }
main { width: 100%; max-width: 1200px; margin: auto; padding: 30px 5% 70px; }
.page-title { font-size: 28px; margin-bottom: 6px; }
.page-title span { color: #a855f7; }
.page-sub { color: #999; margin-bottom: 30px; font-size: 14px; }

/* Section styles */
.section { margin-bottom: 35px; }
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #d8b4fe; }

/* Health card */
.health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
.health-card { background: #101017; border: 1px solid #292936; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; }
.health-dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.6); flex-shrink: 0; }
.health-dot.warn { background: #eab308; box-shadow: 0 0 12px rgba(234,179,8,0.6); }
.health-dot.err { background: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,0.6); }
.health-info h4 { font-size: 14px; color: #ccc; margin-bottom: 4px; }
.health-info p { font-size: 13px; color: #888; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stat-card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; }
.stat-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(139,92,246,0.15); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px; }
.stat-label { font-size: 13px; color: #a7a7b5; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 800; }
.stat-trend { font-size: 12px; color: #22c55e; margin-top: 4px; }
.stat-trend.neutral { color: #999; }

/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
.tab { padding: 9px 16px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #ccc; cursor: pointer; font-size: 13px; font-weight: 600; }
.tab.active { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; border-color: transparent; }

/* Tables */
.table-wrap { background: #101017; border: 1px solid #292936; border-radius: 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th, td { padding: 14px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid #1f1f29; }
th { color: #a7a7b5; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; background: #0c0c13; }
td { color: #ddd; }
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover { background: rgba(139,92,246,0.06); }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: capitalize; }
.badge.pending { background: #24183a; color: #b98aff; }
.badge.completed { background: #14321c; color: #9cffb0; }
.badge.failed { background: #3a1616; color: #ff9c9c; }
.badge.admin { background: linear-gradient(90deg, #7c3aed, #a855f7); color: white; }
.empty-state { text-align: center; padding: 50px 20px; color: #888; }
.empty-state h3 { color: #aaa; margin-bottom: 8px; }

/* Loading spinner */
.loader { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.10); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: #101017; border: 1px solid #292936; border-radius: 18px; padding: 25px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal h2 { font-size: 20px; margin-bottom: 8px; }
.modal .modal-sub { color: #999; margin-bottom: 20px; font-size: 14px; }
.modal .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #999; font-size: 24px; cursor: pointer; }
.modal-header { position: relative; }
.modal-video-item { background: #0b0b12; border: 1px solid #292936; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.modal-video-item .vi-prompt { color: #ccc; margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
.modal-video-item .vi-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: #888; }

@media (max-width: 750px) {
    .page-title { font-size: 24px; }
    th, td { padding: 10px 12px; font-size: 13px; }
    .stat-value { font-size: 22px; }
    .logo-text { font-size: 18px; }
}
</style>
</head>
<body>

<div id="loadingPage" class="loader">
    <div class="spinner"></div>
    <p style="color:#999;">Checking admin access...</p>
</div>

<div id="pageContent" style="display:none;">

<header>
    <a href="admin.html" class="logo-link">
        <img src="logo.jpg" alt="Emmy AI" class="logo-img">
        <span class="logo-text">Emmy <span>AI</span></span>
        <span class="admin-badge">ADMIN</span>
    </a>
    <div class="header-actions">
        <a href="dashboard.html">← Dashboard</a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
</header>

<main>

    <h1 class="page-title">Admin <span>Dashboard</span></h1>
    <p class="page-sub">Monitor users, video requests, and site health.</p>

    <!-- HEALTH SECTION -->
    <div class="section">
        <h2 class="section-title">🚀 Website Health</h2>
        <div class="health-grid" id="healthGrid"></div>
    </div>

    <!-- GROWTH / STATS -->
    <div class="section">
        <h2 class="section-title">📈 Growth & Activity</h2>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" data-tab="users">👥 Users</button>
        <button class="tab" data-tab="videos">🎬 Video Requests</button>
    </div>

    <!-- USERS TAB -->
    <div id="usersTab">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Credits</th>
                        <th>Role</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="4" style="text-align:center; color:#888;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- VIDEOS TAB -->
    <div id="videosTab" style="display:none;">
        <div class="tabs" style="margin-bottom:15px;">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">Pending</button>
            <button class="tab" data-filter="completed">Completed</button>
            <button class="tab" data-filter="failed">Failed</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>Prompt</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="videosTable">
                    <tr><td colspan="4" style="text-align:center; color:#888;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<!-- USER DETAIL MODAL -->
<div class="modal-overlay" id="userModal">
    <div class="modal">
        <div class="modal-header">
            <button class="modal-close" id="modalClose">×</button>
            <h2 id="modalTitle">User Detail</h2>
            <p class="modal-sub" id="modalSub"></p>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script src="appwrite.js"></script>

<script>
/* ==================================================
   ADMIN DASHBOARD
   ================================================== */

let allUsers = [];
let allVideos = [];
let currentVideoFilter = "all";

/* ---------- INIT ---------- */
async function init() {
    try {
        const user = await getCurrentUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        // Fetch the user's row from users table (to check isAdmin)
        let userRow = null;
        try {
            userRow = await tablesDB.getRow({
                databaseId: DATABASE_ID,
                tableId: USERS_TABLE_ID,
                rowId: user.$id
            });
        } catch (e) {
            // Maybe the users table row doesn't exist for this user
            console.warn("Could not fetch user row:", e);
        }

        // Fallback: try to find by userId field
        if (!userRow) {
            try {
                const found = await tablesDB.listRows({
                    databaseId: DATABASE_ID,
                    tableId: USERS_TABLE_ID,
                    queries: [Appwrite.Query.equal("userId", user.$id)]
                });
                if (found.rows && found.rows.length > 0) {
                    userRow = found.rows[0];
                }
            } catch (e) {
                console.warn("Fallback lookup failed:", e);
            }
        }

        // Check admin status
        if (!userRow || userRow.isAdmin !== true) {
            alert("Access denied. This area is for administrators only.");
            window.location.href = "dashboard.html";
            return;
        }

        // Show page
        document.getElementById("loadingPage").style.display = "none";
        document.getElementById("pageContent").style.display = "block";

        // Load data
        await loadAllData();

    } catch (error) {
        console.error("ADMIN INIT ERROR:", error);
        document.getElementById("loadingPage").innerHTML =
            '<p style="color:#ff7777; text-align:center;">Error loading admin dashboard: ' + (error.message || error) + '</p>';
    }
}

/* ---------- DATA LOADING ---------- */
async function loadAllData() {
    await Promise.all([
        loadUsers(),
        loadVideos()
    ]);
    renderHealth();
    renderStats();
    renderUsers();
    renderVideos();
}

async function loadUsers() {
    try {
        const result = await tablesDB.listRows({
            databaseId: DATABASE_ID,
            tableId: USERS_TABLE_ID,
            queries: [Appwrite.Query.orderDesc("$createdAt"), Appwrite.Query.limit(100)]
        });
        allUsers = result.rows || [];
    } catch (e) {
        console.error("Failed to load users:", e);
        allUsers = [];
    }
}

async function loadVideos() {
    try {
        const result = await tablesDB.listRows({
            databaseId: DATABASE_ID,
            tableId: VIDEOS_TABLE_ID,
            queries: [Appwrite.Query.orderDesc("$createdAt"), Appwrite.Query.limit(100)]
        });
        allVideos = result.rows || [];
    } catch (e) {
        console.error("Failed to load videos:", e);
        allVideos = [];
    }
}

/* ---------- HEALTH RENDERING ---------- */
function renderHealth() {
    const grid = document.getElementById("healthGrid");

    // Database health: did we successfully load data?
    const dbHealthy = allUsers !== null && allVideos !== null;
    const dbStatus = dbHealthy ? "Operational" : "Issue detected";
    const dbDotClass = dbHealthy ? "" : "err";

    // Last video request time
    const latestVideo = allVideos[0];
    const lastActivity = latestVideo
        ? timeAgo(latestVideo.$createdAt)
        : "No activity yet";

    // Pending videos count
    const pending = allVideos.filter(v => (v.status || "pending") === "pending").length;
    const pendingDot = pending > 20 ? "warn" : "";

    grid.innerHTML = `
        <div class="health-card">
            <div class="health-dot ${dbDotClass}"></div>
            <div class="health-info">
                <h4>Database</h4>
                <p>${dbStatus} · ${allUsers.length} users · ${allVideos.length} videos</p>
            </div>
        </div>

        <div class="health-card">
            <div class="health-dot"></div>
            <div class="health-info">
                <h4>Website</h4>
                <p>Online · Auto-deploy from GitHub</p>
            </div>
        </div>

        <div class="health-card">
            <div class="health-dot ${pendingDot}"></div>
            <div class="health-info">
                <h4>Last Activity</h4>
                <p>${escapeHtml(lastActivity)}</p>
            </div>
        </div>

        <div class="health-card">
            <div class="health-dot"></div>
            <div class="health-info">
                <h4>AI Generator</h4>
                <p>Not connected (testing mode)</p>
            </div>
        </div>
    `;
}

/* ---------- STATS RENDERING ---------- */
function renderStats() {
    const grid = document.getElementById("statsGrid");

    const totalUsers = allUsers.length;
    const totalVideos = allVideos.length;
    const pending = allVideos.filter(v => (v.status || "pending") === "pending").length;
    const completed = allVideos.filter(v => v.status === "completed").length;
    const failed = allVideos.filter(v => v.status === "failed").length;

    // Growth: last 7 days
    const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
    const newUsersWeek = allUsers.filter(u => new Date(u.$createdAt).getTime() > sevenDaysAgo).length;
    const newVideosWeek = allVideos.filter(v => new Date(v.$createdAt).getTime() > sevenDaysAgo).length;

    grid.innerHTML = `
        <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-label">Total Users</div>
            <div class="stat-value">${totalUsers}</div>
            <div class="stat-trend ${newUsersWeek === 0 ? 'neutral' : ''}">+${newUsersWeek} this week</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">🎬</div>
            <div class="stat-label">Total Videos</div>
            <div class="stat-value">${totalVideos}</div>
            <div class="stat-trend ${newVideosWeek === 0 ? 'neutral' : ''}">+${newVideosWeek} this week</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div class="stat-label">Pending</div>
            <div class="stat-value">${pending}</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-label">Completed</div>
            <div class="stat-value">${completed}</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">❌</div>
            <div class="stat-label">Failed</div>
            <div class="stat-value">${failed}</div>
        </div>
    `;
}

/* ---------- USERS TABLE ---------- */
function renderUsers() {
    const tbody = document.getElementById("usersTable");

    if (allUsers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888; padding:40px;">No users yet</td></tr>';
        return;
    }

    tbody.innerHTML = allUsers.map(u => {
        const isAdmin = u.isAdmin === true;
        const joined = formatDate(u.$createdAt);
        return `
            <tr class="clickable" data-user='${escapeAttr(JSON.stringify(u))}'>
                <td>${escapeHtml(u.email || "—")}</td>
                <td>${u.credits != null ? u.credits : 0}</td>
                <td>${isAdmin ? '<span class="badge admin">Admin</span>' : 'User'}</td>
                <td>${joined}</td>
            </tr>
        `;
    }).join("");

    // Wire up row clicks
    tbody.querySelectorAll("tr.clickable").forEach(tr => {
        tr.addEventListener("click", function () {
            const user = JSON.parse(this.getAttribute("data-user"));
            showUserModal(user);
        });
    });
}

/* ---------- VIDEOS TABLE ---------- */
function renderVideos() {
    const tbody = document.getElementById("videosTable");

    let videos = allVideos;
    if (currentVideoFilter !== "all") {
        videos = videos.filter(v => (v.status || "pending") === currentVideoFilter);
    }

    if (videos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888; padding:40px;">No video requests</td></tr>';
        return;
    }

    tbody.innerHTML = videos.map(v => {
        const email = findUserEmail(v.userId);
        const status = v.status || "pending";
        return `
            <tr>
                <td>${escapeHtml(email)}</td>
                <td style="max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(v.prompt || "—")}</td>
                <td><span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span></td>
                <td>${formatDate(v.$createdAt)}</td>
            </tr>
        `;
    }).join("");
}

function findUserEmail(userId) {
    const user = allUsers.find(u => u.userId === userId || u.$id === userId);
    return user ? user.email : userId || "Unknown";
}

/* ---------- MODAL: USER DETAIL ---------- */
async function showUserModal(user) {
    const modal = document.getElementById("userModal");
    const title = document.getElementById("modalTitle");
    const sub = document.getElementById("modalSub");
    const body = document.getElementById("modalBody");

    title.textContent = user.email || "User";
    sub.textContent = "Joined " + formatDate(user.$createdAt);

    // Find this user's videos
    const userVideos = allVideos.filter(v => v.userId === user.userId || v.userId === user.$id);

    let videosHtml = "";
    if (userVideos.length === 0) {
        videosHtml = '<p style="color:#888; text-align:center; padding:20px;">No videos yet</p>';
    } else {
        videosHtml = userVideos.map(v => `
            <div class="modal-video-item">
                <div class="vi-prompt">${escapeHtml(v.prompt || "No prompt")}</div>
                <div class="vi-meta">
                    <span class="badge ${escapeHtml(v.status || 'pending')}">${escapeHtml(v.status || "pending")}</span>
                    <span>${formatDate(v.$createdAt)}</span>
                </div>
            </div>
        `).join("");
    }

    body.innerHTML = `
        <p style="color:#a7a7b5; font-size:13px; margin-bottom:8px;">USER INFO</p>
        <p style="margin-bottom:6px;"><strong>Email:</strong> ${escapeHtml(user.email || "—")}</p>
        <p style="margin-bottom:6px;"><strong>User ID:</strong> <span style="color:#888; font-size:12px;">${escapeHtml(user.userId || user.$id)}</span></p>
        <p style="margin-bottom:6px;"><strong>Credits:</strong> ${user.credits != null ? user.credits : 0}</p>
        <p style="margin-bottom:20px;"><strong>Admin:</strong> ${user.isAdmin === true ? "Yes ✅" : "No"}</p>

        <p style="color:#a7a7b5; font-size:13px; margin-bottom:10px;">VIDEOS (${userVideos.length})</p>
        ${videosHtml}
    `;

    modal.classList.add("active");
}

/* ---------- HELPERS ---------- */
function formatDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHr = Math.floor(diffMs / 3600000);
    const diffDay = Math.floor(diffMs / 86400000);

    if (diffMin < 1) return "just now";
    if (diffMin < 60) return diffMin + "m ago";
    if (diffHr < 24) return diffHr + "h ago";
    if (diffDay < 7) return diffDay + "d ago";

    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function timeAgo(iso) {
    return formatDate(iso);
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
}

function escapeAttr(text) {
    return String(text).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
}

/* ---------- TABS ---------- */
document.querySelectorAll(".tabs .tab[data-tab]").forEach(tab => {
    tab.addEventListener("click", function () {
        document.querySelectorAll(".tabs .tab[data-tab]").forEach(t => t.classList.remove("active"));
        this.classList.add("active");

        const which = this.getAttribute("data-tab");
        document.getElementById("usersTab").style.display = (which === "users") ? "block" : "none";
        document.getElementById("videosTab").style.display = (which === "videos") ? "block" : "none";
    });
});

document.querySelectorAll(".tab[data-filter]").forEach(tab => {
    tab.addEventListener("click", function () {
        document.querySelectorAll(".tab[data-filter]").forEach(t => t.classList.remove("active"));
        this.classList.add("active");
        currentVideoFilter = this.getAttribute("data-filter");
        renderVideos();
    });
});

/* ---------- MODAL CLOSE ---------- */
document.getElementById("modalClose").addEventListener("click", function () {
    document.getElementById("userModal").classList.remove("active");
});

document.getElementById("userModal").addEventListener("click", function (e) {
    if (e.target === this) this.classList.remove("active");
});

/* ---------- LOGOUT ---------- */
document.getElementById("logoutBtn").addEventListener("click", async function () {
    try {
        await account.deleteSession({ sessionId: "current" });
        window.location.href = "login.html";
    } catch (e) {
        alert("Unable to logout.");
    }
});

/* ---------- START ---------- */
init();
</script>

</body>
</html>
